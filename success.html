<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment Successful - HomeThali</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f7f4;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* ================= SUCCESS CARD ================= */
.success-card {
    background: white;
    width: 90%;
    max-width: 420px;
    padding: 35px 30px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
}

/* ================= ANIMATION ================= */
.checkmark-wrapper {
    width: 90px;
    height: 90px;
    margin: auto;
    border-radius: 50%;
    background: #4CAF50;
    display: flex;
    justify-content: center;
    align-items: center;
    animation: pop 0.5s ease;
}

.checkmark {
    width: 30px;
    height: 55px;
    border-right: 6px solid white;
    border-bottom: 6px solid white;
    transform: rotate(45deg);
}

@keyframes pop {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}

/* ================= TEXT ================= */
h1 {
    color: #4CAF50;
    margin: 18px 0 8px;
}

.subtext {
    color: #666;
    font-size: 15px;
}

/* ================= DETAILS ================= */
.details {
    margin-top: 25px;
    text-align: left;
}

.detail-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px dashed #ddd;
    font-size: 15px;
}

.detail-row:last-child {
    border-bottom: none;
}

.label {
    color: #777;
}

.value {
    font-weight: bold;
}

/* ================= TOKEN ================= */
.token {
    margin: 20px 0;
    font-size: 34px;
    color: #4CAF50;
    font-weight: bold;
}

/* ================= BUTTON ================= */
.home-btn {
    margin-top: 25px;
    width: 100%;
    padding: 15px;
    font-size: 18px;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
}

.home-btn:active {
    transform: scale(0.97);
}

/* ================= TIMER ================= */
.timer {
    margin-top: 15px;
    font-size: 14px;
    color: #777;
}
</style>
</head>

<body>

<div class="success-card">

    <!-- Animation -->
    <div class="checkmark-wrapper">
        <div class="checkmark"></div>
    </div>

    <h1>Payment Successful</h1>
    <div class="subtext">Thank you for ordering with HomeThali</div>

    <!-- Token -->
    <div class="token" id="tokenNo">HT000</div>

    <!-- Order Details -->
    <div class="details">
        <div class="detail-row">
            <span class="label">Customer</span>
            <span class="value" id="custName"></span>
        </div>
        <div class="detail-row">
            <span class="label">Room</span>
            <span class="value" id="custRoom"></span>
        </div>
        <div class="detail-row">
            <span class="label">Payment</span>
            <span class="value" id="paymentMethod"></span>
        </div>
        <div class="detail-row">
            <span class="label">Amount Paid</span>
            <span class="value">₹ <span id="totalAmount"></span></span>
        </div>
    </div>

    <button class="home-btn" onclick="goHome()">New Order</button>

    <div class="timer">
        Redirecting in <span id="countdown">15</span> seconds
    </div>
</div>

<script>
/* ================= LOAD DATA ================= */
document.getElementById("custName").innerText =
    localStorage.getItem("customer_name") || "Customer";

document.getElementById("custRoom").innerText =
    localStorage.getItem("room_number") || "-";

document.getElementById("paymentMethod").innerText =
    localStorage.getItem("payment_method") || "-";

/* ================= TOTAL ================= */
const cart = JSON.parse(localStorage.getItem("cart")) || {};
let total = 0;
for (let id in cart) {
    total += cart[id].qty * cart[id].price;
}
document.getElementById("totalAmount").innerText = total;

/* ================= TOKEN ================= */
const token = "HT" + Math.floor(100 + Math.random() * 900);
document.getElementById("tokenNo").innerText = token;

/* ================= RESET & HOME ================= */
function clearSession() {
    localStorage.removeItem("cart");
    localStorage.removeItem("customer_name");
    localStorage.removeItem("customer_phone");
    localStorage.removeItem("room_number");
    localStorage.removeItem("payment_method");
    localStorage.removeItem("otp_verified");
}

function goHome() {
    clearSession();
    window.location.href = "index.html";
}

/* ================= AUTO REDIRECT ================= */
let timeLeft = 15;
const timer = document.getElementById("countdown");

const interval = setInterval(() => {
    timeLeft--;
    timer.innerText = timeLeft;

    if (timeLeft <= 0) {
        clearInterval(interval);
        goHome();
    }
}, 1000);
</script>

</body>
</html>
