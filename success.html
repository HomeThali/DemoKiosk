<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment Successful - HomeThali</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f7f4;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.success-card {
    background: white;
    width: 90%;
    max-width: 420px;
    padding: 35px 30px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
}

.checkmark-wrapper {
    width: 90px;
    height: 90px;
    margin: auto;
    border-radius: 50%;
    background: #4CAF50;
    display: flex;
    justify-content: center;
    align-items: center;
    animation: pop 0.5s ease;
}

.checkmark {
    width: 30px;
    height: 55px;
    border-right: 6px solid white;
    border-bottom: 6px solid white;
    transform: rotate(45deg);
}

@keyframes pop {
    from { transform: scale(0.6); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

h1 {
    color: #4CAF50;
    margin: 18px 0 8px;
}

.subtext {
    color: #666;
    font-size: 15px;
}

.token {
    margin: 20px 0;
    font-size: 34px;
    color: #4CAF50;
    font-weight: bold;
}

.details {
    margin-top: 20px;
    text-align: left;
}

.detail-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px dashed #ddd;
}

.detail-row:last-child {
    border-bottom: none;
}

.home-btn {
    margin-top: 25px;
    width: 100%;
    padding: 15px;
    font-size: 18px;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
}

.timer {
    margin-top: 15px;
    font-size: 14px;
    color: #777;
}
</style>
</head>

<body>

<div class="success-card">

    <div class="checkmark-wrapper">
        <div class="checkmark"></div>
    </div>

    <h1>Payment Successful</h1>
    <div class="subtext">Thank you for ordering with HomeThali</div>

    <div class="token" id="tokenNo"></div>

    <div class="details">
        <div class="detail-row">
            <span>Customer</span>
            <strong id="custName"></strong>
        </div>
        <div class="detail-row">
            <span>Room</span>
            <strong id="custRoom"></strong>
        </div>
        <div class="detail-row">
            <span>Payment</span>
            <strong id="paymentMethod"></strong>
        </div>
        <div class="detail-row">
            <span>Amount Paid</span>
            <strong>₹ <span id="totalAmount"></span></strong>
        </div>
    </div>

    <button class="home-btn" onclick="goHome()">New Order</button>

    <div class="timer">
        Redirecting in <span id="countdown">15</span> seconds
    </div>
</div>

<script>
/* ================= LOAD DATA ================= */
const customerName = localStorage.getItem("customer_name") || "Customer";
const customerRoom = localStorage.getItem("room_number") || "-";
const paymentMethod = localStorage.getItem("payment_method") || "-";
const cart = JSON.parse(localStorage.getItem("cart")) || {};

document.getElementById("custName").innerText = customerName;
document.getElementById("custRoom").innerText = customerRoom;
document.getElementById("paymentMethod").innerText = paymentMethod;

/* ================= TOTAL ================= */
let total = 0;
for (let id in cart) {
    total += cart[id].qty * cart[id].price;
}
document.getElementById("totalAmount").innerText = total;

/* ================= TOKEN ================= */
let token = localStorage.getItem("order_id");
if (!token) {
    token = "HT" + Date.now(); // 🔥 unique always
    sessionStorage.setItem("order_id", token);
}
document.getElementById("tokenNo").innerText = token;

/* ================= SAVE ORDER (ONCE) ================= */
if (!localStorage.getItem("order_saved")) {
    fetch("api/save_order.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            order_id: token,
            customer: {
                name: customerName,
                phone: localStorage.getItem("customer_phone"),
                room: customerRoom
            },
            cart: cart,
            payment_method: paymentMethod,
            total_amount: total
        })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            localStorage.setItem("order_saved", "true");
        } else {
            alert("Order save failed. Please contact staff.");
        }
    })
    .catch(() => alert("Server error while saving order"));
}

/* ================= RESET & HOME ================= */
function clearSession() {
    [
        "cart","customer_name","customer_phone","room_number",
        "payment_method","otp_verified","order_saved","order_id"
    ].forEach(k => localStorage.removeItem(k));
}

function goHome() {
    clearSession();
    window.location.href = "index.html";
}

/* ================= AUTO REDIRECT ================= */
let timeLeft = 15;
const timer = document.getElementById("countdown");

const interval = setInterval(() => {
    timeLeft--;
    timer.innerText = timeLeft;
    if (timeLeft <= 0) {
        clearInterval(interval);
        goHome();
    }
}, 1000);
</script>

</body>
</html>
